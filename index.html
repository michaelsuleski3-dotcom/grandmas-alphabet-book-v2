<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grandma's Alphabet Book</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=230">

    <meta name="theme-color" content="#6B4423">
</head>

<body>

    <!-- Simple Opening Cover -->

    <div id="cover-screen">

        <div class="cover">

            <h1>Grandma's Alphabet Book</h1>

            <p class="subtitle">
                Everything in its place.
            </p>

            <button id="open-book" type="button">
                Open Book
            </button>

        </div>

    </div>

    <!-- Main Alphabet Book -->

    <div id="book-screen" class="hidden">

        <header>
            <h2>Grandma's Alphabet Book</h2>
        </header>

        <div class="book-layout">

            <main>

                <h3 id="current-letter">A</h3>

                <div
                    id="editor"
                    contenteditable="true"
                    spellcheck="true"
                ></div>

            </main>

            <nav
                id="letter-tabs"
                aria-label="Alphabet pages"
            >
                <!-- A–Z tabs are created by app.js -->
            </nav>

        </div>

    </div>

    <script src="app.js?v=220"></script>

</body>
</html>
